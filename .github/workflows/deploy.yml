# Publie l'app sur GitHub Pages à chaque modification (code ou données).
# Génère aussi les calendriers d'abonnement .ics.
name: Publier l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/events.json','utf8'))"
      - name: Générer les calendriers
        run: node scripts/build-ics.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
